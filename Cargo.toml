[package]
name = "orbit"
version = "0.1.0"
edition = "2021"
authors = ["OrbitOS Contributors"]
description = "Fast, modular system manager, rebuilder, and secret management CLI for NixOS / OrbitOS"
license = "MIT"

[[bin]]
name = "orbit"
path = "src/main.rs"

[[bin]]
name = "orbt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v5"] }
colored = "2.1"
anyhow = "1.0"
glob = "0.3"
